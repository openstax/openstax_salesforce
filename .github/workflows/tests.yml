name: Tests
env:
  RAILS_ENV: test

on:
  pull_request:
  push:
    branches:
      - master
jobs:
  tests:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ruby_version:
          - '3.1'
          - '3.2'
        rails_version:
          - 6.1.7.8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
        env:
          RAILS_VERSION: ${{ matrix.rails_version }}
      - name: Test
        run: bundle exec rake spec
